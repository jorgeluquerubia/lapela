name: Spec governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate specs and documentation
        run: npm run specs:check
      - name: Require spec traceability for implementation changes
        env:
          SPEC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run specs:check -- --changed-from "$SPEC_BASE_SHA"
      - name: Validate task branch
        if: github.event_name == 'pull_request'
        run: npm run specs:check -- --branch-name "${{ github.head_ref }}"
